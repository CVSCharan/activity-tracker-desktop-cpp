name: Multi-Platform CI Build (Windows, Apple Silicon & Intel macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSVC 2022 (x64)
          - os: windows-2022
            name: Windows x64
            platform: windows
            arch: win64_msvc2022_64
            build_type: Debug
          - os: windows-2022
            name: Windows x64
            platform: windows
            arch: win64_msvc2022_64
            build_type: Release

          # macOS Apple Silicon (ARM64 - M-series)
          - os: macos-latest
            name: macOS Apple Silicon (ARM64)
            platform: macos-arm64
            arch: clang_64
            build_type: Debug
          - os: macos-latest
            name: macOS Apple Silicon (ARM64)
            platform: macos-arm64
            arch: clang_64
            build_type: Release

          # macOS Intel (x86_64)
          - os: macos-13
            name: macOS Intel (x86_64)
            platform: macos-intel
            arch: clang_64
            build_type: Debug
          - os: macos-13
            name: macOS Intel (x86_64)
            platform: macos-intel
            arch: clang_64
            build_type: Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ runner.os == 'Windows' && 'windows' || 'mac' }}
          target: 'desktop'
          arch: ${{ matrix.arch }}
          setup-python: false
          cache: true

      # ── Build on Windows ─────────────────────────────────────────────────────
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 .

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config ${{ matrix.build_type }}

      - name: Run Unit Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Deploy Dependencies with windeployqt (Windows Release)
        if: runner.os == 'Windows' && matrix.build_type == 'Release'
        run: |
          windeployqt --qmldir qml build/Release/ActivityTracker.exe
          Compress-Archive -Path build/Release/* -DestinationPath ActivityTracker-Windows-Release.zip

      # ── Build on macOS (Apple Silicon & Intel) ────────────────────────────────
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} .

      - name: Compile (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config ${{ matrix.build_type }}

      - name: Run Unit Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Package with macdeployqt (macOS Release)
        if: runner.os == 'macOS' && matrix.build_type == 'Release'
        run: |
          macdeployqt build/ActivityTracker.app -qmldir=qml
          zip -r ActivityTracker-macOS-Release.zip build/ActivityTracker.app

      # ── Upload Artifacts ─────────────────────────────────────────────────────
      - name: Upload Windows Release Artifact
        if: matrix.platform == 'windows' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ActivityTracker-Windows-Release
          path: ActivityTracker-Windows-Release.zip

      - name: Upload macOS Apple Silicon Release Artifact
        if: matrix.platform == 'macos-arm64' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ActivityTracker-macOS-AppleSilicon-Release
          path: ActivityTracker-macOS-Release.zip

      - name: Upload macOS Intel Release Artifact
        if: matrix.platform == 'macos-intel' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ActivityTracker-macOS-Intel-Release
          path: ActivityTracker-macOS-Release.zip
