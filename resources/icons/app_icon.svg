<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F242C"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#30363D" stroke-width="6"/>

  <!-- CVS Monogram Badge -->
  <rect x="78" y="32" width="100" height="26" rx="8" fill="url(#blueGrad)" />
  <text x="128" y="50" font-family="Segoe UI, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">CVS TECH</text>

  <!-- Activity 1 (Completed) -->
  <circle cx="68" cy="100" r="16" fill="url(#greenGrad)" />
  <path d="M60 100 L66 106 L77 92" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="96" y="93" width="92" height="14" rx="7" fill="#6E7681"/>

  <!-- Activity 2 (In Progress - Pulsing Blue Ring) -->
  <circle cx="68" cy="148" r="15" fill="none" stroke="url(#blueGrad)" stroke-width="5" filter="url(#glow)"/>
  <circle cx="68" cy="148" r="7" fill="#58A6FF"/>
  <rect x="96" y="141" width="104" height="14" rx="7" fill="#F0F6FC"/>

  <!-- Activity 3 (Upcoming) -->
  <circle cx="68" cy="196" r="15" fill="none" stroke="#30363D" stroke-width="4"/>
  <rect x="96" y="189" width="76" height="14" rx="7" fill="#30363D"/>
</svg>
